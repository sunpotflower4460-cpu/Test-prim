<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#071525">
  <meta name="description" content="LUMINA — 星灯りの庭。3つの世界をめぐる、スマートフォンで遊べる幻想アクションゲーム。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LUMINA">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <title>LUMINA — 星灯りの庭</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="world" aria-label="星灯りの庭 ゲーム画面"></canvas>
  <div class="grain" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header id="topbar" class="topbar hidden" aria-label="ゲーム情報">
    <div class="toprow">
      <div class="chapter" id="chapterLabel">第一章 · 黎明の森</div>
      <div class="righttools">
        <button class="toolbtn" id="soundBtn" aria-label="音の切り替え" title="音の切り替え">♫</button>
        <button class="toolbtn" id="pauseBtn" aria-label="一時停止" title="一時停止">Ⅱ</button>
      </div>
    </div>
    <div class="statusrow">
      <div class="healthpanel">
        <div class="statuslabel"><span>生命の灯</span><strong id="hpLabel">100 / 100</strong></div>
        <div class="bar hp"><div id="hpFill"></div></div>
      </div>
      <div class="timepanel"><span id="timeLabel">00:00</span><small id="stageHint">星を集めよう</small></div>
    </div>
    <div class="xpstrip"><span id="levelLabel">LV 1</span><div class="bar xp"><div id="xpFill"></div></div><span id="killLabel">✧ 0</span></div>
    <div class="bossbar hidden" id="bossbar"><div class="bossline"><span id="bossName">影の守護者</span><span>守護者</span></div><div class="bar boss"><div id="bossFill"></div></div></div>
  </header>

  <div id="mobileControls" class="mobile-controls hidden" aria-label="タッチ操作">
    <div class="joystick-zone" id="joystick" aria-label="移動用スティック">
      <div class="joystick-base"><div id="stickKnob" class="joystick-knob"><span>✦</span></div></div>
      <div class="joystick-label">MOVE</div>
    </div>
    <button id="dashBtn" class="dash-btn" aria-label="ダッシュ">
      <span class="dash-glow"></span><span class="dash-glyph">➤</span>
      <span class="dash-text">DASH</span><span class="dash-progress" id="dashProgress"></span>
    </button>
  </div>

  <main id="home" class="screen">
    <div class="home-content">
      <div class="eyebrow"><span class="star-small">✧</span> AN INTERACTIVE FAIRYTALE <span class="star-small">✧</span></div>
      <div class="title-orbit"><span class="orbit-spark">✦</span></div>
      <h1>LUMINA</h1>
      <p class="jp-title">星灯りの庭</p>
      <div class="divider-star"><span></span> ✧ <span></span></div>
      <p class="opening">光が眠る、３つの世界。<br>最後の星を、あなたの手で。</p>
      <button id="startBtn" class="primary"><span>旅をはじめる</span><b>↗</b></button>
      <p class="smallhint">指で移動 · 攻撃は自動 · ダッシュで回避</p>
      <div id="bestRecord" class="record"></div>
    </div>
    <div class="footer-note">MADE OF STARDUST <span>✦</span> MADE FOR YOU</div>
  </main>

  <section id="overlay" class="screen hidden" aria-live="polite"></section>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="flash" class="flash" aria-hidden="true"></div>

  <script src="game.js" defer></script>
</body>
</html>
