<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1a120c">
  <meta name="description" content="MIKAN — 蜜柑。こたつの上に蜜柑を置き、朝まで残す夜の遊び。Grok 4.7 Cursor オリジナル作品。">
  <title>MIKAN — 蜜柑 | Grok 4.7 Cursor</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="mikan.css">
  <script src="phys.js" defer></script>
  <script src="levels.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main id="app" data-view="title">
    <div class="roomwash" aria-hidden="true"></div>
    <section id="title" class="view" aria-label="蜜柑 タイトル">
      <header class="topline">
        <a class="back" href="../grok/index.html">‹ <span>作品一覧</span></a>
        <span class="byline">AN ORIGINAL BY GROK 4.7 CURSOR</span>
        <button id="titleSound" class="icon" type="button" aria-label="音の切り替え">♫</button>
      </header>
      <div class="title-art" aria-hidden="true">
        <div class="glow"></div>
        <div class="kotatsu"><i></i><i></i></div>
        <div class="futon"></div>
        <div class="fruit"></div>
      </div>
      <div class="title-copy">
        <p class="eyebrow">A KOTATSU IN WINTER</p>
        <h1>MI<em>KAN</em></h1>
        <p class="jp">蜜柑</p>
        <p class="story">こたつの上に、<br>いくつ残せる。</p>
        <p class="lead">六つの晩。落とす場所だけを、選ぶ。<br>裾の外と、灯りには、気をつけて。</p>
      </div>
      <div class="title-actions">
        <button id="startBtn" class="primary" type="button"><span>こたつにつく</span><b>↗</b></button>
        <button id="howBtn" class="text" type="button">あそびかた</button>
        <p id="titleRecord" class="record">まだ、どの晩も寒い。</p>
      </div>
      <footer class="title-foot"><span>NO CLOCK</span><span>6 NIGHTS</span></footer>
    </section>

    <section id="map" class="view" hidden aria-label="晩の一覧">
      <header class="topline">
        <button id="mapBack" class="back" type="button">‹ <span>タイトル</span></button>
        <span class="byline">SIX NIGHTS</span>
        <button id="mapSound" class="icon" type="button" aria-label="音の切り替え">♫</button>
      </header>
      <div class="map-intro">
        <p class="eyebrow">THE KOTATSU</p>
        <h2>どの晩を、<em>過ごす。</em></h2>
        <p id="mapProgress" class="record"></p>
      </div>
      <div id="nightList" class="night-list"></div>
    </section>

    <section id="play" class="view play" hidden aria-label="こたつの天板">
      <header class="topline play-top">
        <button id="playBack" class="back" type="button">‹ <span>晩の一覧</span></button>
        <div class="room-heading"><span class="eyebrow">NIGHT</span><strong id="nightName"></strong></div>
        <button id="pauseBtn" class="icon" type="button" aria-label="一時停止">Ⅱ</button>
      </header>
      <p id="hintLine" class="hint"></p>
      <div id="boardWrap" class="board-wrap">
        <canvas id="kotatsu" aria-label="こたつ。蜜柑を置く場所を選び、天板の上に残す。"></canvas>
      </div>
      <div class="dock">
        <p id="remain" class="remain">のこり 0</p>
        <div class="tools">
          <button id="dropBtn" class="tool primary-tool" type="button">置く</button>
          <button id="undoBtn" class="tool" type="button" disabled>戻す</button>
        </div>
      </div>
    </section>

    <div id="modal" class="modal" hidden>
      <section id="dialog" class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1"></section>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <noscript><p class="noscript">このこたつを暖めるには JavaScript が必要です。<a href="../grok/index.html">作品一覧へ戻る</a></p></noscript>
  </main>
</body>
</html>
