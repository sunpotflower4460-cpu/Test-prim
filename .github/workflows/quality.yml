name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check game.js
          node --check sumifu.js
          node --check code-sim.js
          node --check code.js
          node --check sync-sim.js
          node --check sync.js
          node --check helix-sim.js
          node --check helix.js
          node --check sol/entry.js
          node --check sol/sim.js
          node --check sol/levels.js
          node --check sol/sea.js
          node --check sol/audio.js
          node --check sol/game.js
          node --check echo/sim.js
          node --check echo/levels.js
          node --check echo/audio.js
          node --check echo/render.js
          node --check echo/game.js
          node --check luna/luna.js
          node --check oriko/optics.js
          node --check oriko/levels.js
          node --check oriko/game.js
          node --check mikan/phys.js
          node --check mikan/levels.js
          node --check mikan/game.js
          node --check hebi/sim.js
          node --check hebi/levels.js
          node --check hebi/game.js
          node --check kake/sim.js
          node --check kake/levels.js
          node --check kake/game.js
          node --check sol/skyward/sim.js
          node --check sol/skyward/scene.js
          node --check sol/skyward/hud.js
          node --check sol/skyward/audio.js
          node --check sol/skyward/game.js
          node --check gpt6-sol/rules.js
          node --check gpt6-sol/levels.js
          node --check gpt6-sol/sound.js
          node --check gpt6-sol/game.js
          node --check opus/sim.js
          node --check opus/levels.js
          node --check opus/script.js
          node --check opus/solutions.js
          node --check opus/render.js
          node --check opus/audio.js
          node --check opus/game.js
          node --check opus/guide.js
          node --check opus/door.js
          node --check sw.js
          node --check tests/browser-smoke.cjs
          node --check tests/luna.test.cjs
          node --check tests/reprise.test.cjs
          node --check tests/skyward.test.cjs
          node --check tests/assets.test.cjs
          node --check tests/sw.test.cjs
          node --check tests/mizuho.test.cjs
      - name: Game smoke tests
        run: node --test tests/*.test.cjs
      - name: Chart and level integrity
        run: |
          node tools/balance.cjs
          python3 tools/wiring-check.py
      - name: Japanese text scans
        run: |
          python3 tools/jp-scan.py --self-test
          python3 tools/jp-scan.py game.js sumifu.js code.js code-sim.js sync.js sync-sim.js helix.js helix-sim.js helix.css tools/helix-levels.cjs tests/helix.test.cjs sol/entry.js sol/sim.js sol/levels.js sol/sea.js sol/audio.js sol/game.js sol/index.html sol/tide.css luna/luna.js luna/index.html luna/luna.css echo/sim.js echo/levels.js echo/audio.js echo/render.js echo/game.js echo/index.html echo/echo.css oriko/optics.js oriko/levels.js oriko/game.js oriko/index.html oriko/oriko.css mikan/phys.js mikan/levels.js mikan/game.js mikan/index.html mikan/mikan.css hebi/sim.js hebi/levels.js hebi/game.js hebi/index.html hebi/hebi.css kake/sim.js kake/levels.js kake/game.js kake/index.html kake/kake.css grok/index.html grok/shelf.css sw.js index.html style.css README.md manifest.webmanifest sol/works.html sol/works.css sol/skyward/index.html sol/skyward/skyward.css sol/skyward/sim.js sol/skyward/scene.js sol/skyward/hud.js sol/skyward/audio.js sol/skyward/game.js sol/skyward/README.md gpt6-sol/index.html gpt6-sol/reprise.css gpt6-sol/rules.js gpt6-sol/levels.js gpt6-sol/sound.js gpt6-sol/game.js gpt6-sol/README.md opus/index.html opus/mizuho.css opus/sim.js opus/levels.js opus/script.js opus/solutions.js opus/render.js opus/audio.js opus/game.js opus/guide.js opus/door.js opus/README.md tests/mizuho.test.cjs tests/luna.test.cjs tests/reprise.test.cjs tests/skyward.test.cjs tests/assets.test.cjs tests/browser-smoke.cjs tests/sw.test.cjs AUDIT.md
