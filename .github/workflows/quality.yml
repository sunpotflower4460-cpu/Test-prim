name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check game.js
          node --check sumifu.js
          node --check code-sim.js
          node --check code.js
          node --check sync-sim.js
          node --check sync.js
          node --check helix-sim.js
          node --check helix.js
          node --check sol/entry.js
          node --check sol/sim.js
          node --check sol/levels.js
          node --check sol/sea.js
          node --check sol/audio.js
          node --check sol/game.js
          node --check echo/sim.js
          node --check echo/levels.js
          node --check echo/audio.js
          node --check echo/render.js
          node --check echo/game.js
          node --check luna/luna.js
          node --check sol/skyward/sim.js
          node --check sol/skyward/scene.js
          node --check sol/skyward/hud.js
          node --check sol/skyward/audio.js
          node --check sol/skyward/game.js
          node --check sw.js
      - name: Game smoke tests
        run: node --test tests/*.test.cjs
      - name: Chart and level integrity
        run: |
          node tools/balance.cjs
          python3 tools/wiring-check.py
      - name: Japanese text scans
        run: |
          python3 tools/jp-scan.py --self-test
          python3 tools/jp-scan.py game.js sumifu.js code.js code-sim.js sync.js sync-sim.js helix.js helix-sim.js helix.css tools/helix-levels.cjs tests/helix.test.cjs sol/entry.js sol/sim.js sol/levels.js sol/sea.js sol/audio.js sol/game.js sol/index.html sol/tide.css luna/luna.js luna/index.html luna/luna.css echo/sim.js echo/levels.js echo/audio.js echo/render.js echo/game.js echo/index.html echo/echo.css sol/works.html sol/works.css sol/skyward/index.html sol/skyward/skyward.css sol/skyward/sim.js sol/skyward/scene.js sol/skyward/hud.js sol/skyward/audio.js sol/skyward/game.js sol/skyward/README.md sw.js index.html style.css README.md manifest.webmanifest
