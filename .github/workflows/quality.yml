name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check game.js
          node --check sumifu.js
          node --check sw.js
      - name: Game smoke tests
        run: node --test tests/*.test.cjs