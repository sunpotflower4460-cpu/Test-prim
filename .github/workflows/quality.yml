name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Syntax checks
        run: |
          node --check game.js
          node --check sumifu.js
          node --check code-sim.js
          node --check code.js
          node --check sync-sim.js
          node --check sync.js
          node --check sw.js
      - name: Game smoke tests
        run: node --test tests/*.test.cjs
      - name: Chart and level integrity
        run: |
          node tools/balance.cjs
          python3 tools/wiring-check.py
      - name: Japanese text scans
        run: |
          python3 tools/jp-scan.py --self-test
          python3 tools/jp-scan.py game.js sumifu.js code.js code-sim.js sync.js sync-sim.js sw.js index.html style.css README.md manifest.webmanifest